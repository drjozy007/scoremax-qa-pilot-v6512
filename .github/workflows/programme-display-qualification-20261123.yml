name: Exact programme display predicate qualification V13
on:
  pull_request:
  push:
    branches: [perf/sqlite-navigation-release-20261116]
permissions:
  contents: read
jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assemble exact V11 reference
        run: python -B scripts/materialize_scoremax_weighted_chapter_20261123_v11.py
      - name: Preserve code-only V11 reference
        run: python -c "import shutil;shutil.copytree('scoremax_runtime_v669b','qualification/reference_v11',ignore=shutil.ignore_patterns('__pycache__','*.pyc'))"
      - name: Compose exact V13 runtime
        run: python -B scripts/materialize_scoremax_programme_display_20261123_v13.py
      - name: Install accepted dependencies
        run: python -m pip install -r scoremax_runtime_v669b/requirements.txt
      - name: Exact build replay and drift controls
        run: python -B -m unittest discover -s tests/programme_display_20261123 -p 'test_*.py' -v
      - name: Native programme presence count and exact predicate controls
        run: python -B tests/programme_display_20261123/qualify_native_programme_presence_v13.py scoremax_runtime_v669b qualification/programme_state qualification/programme.json
      - name: Native weighted count fallback and commit authority controls
        run: python -B tests/weighted_chapter_20261123/qualify_native_weighted_scope_v11.py scoremax_runtime_v669b qualification/weighted_native_state qualification/weighted_native.json
      - name: Exact retained version authorization on composed V11
        run: python -B -m unittest discover -s tests/successor_qualification_20261123 -p test_successor_qualification_v10.py -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-programme-native-${{ matrix.os }}
          path: qualification/*.json
