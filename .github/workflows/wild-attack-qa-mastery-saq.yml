name: Wild Attack QA Mastery SAQ

on:
  push:
    branches: [qualification/wild-attack-qa-mastery-saq-20260925]
  pull_request:
    branches: [feature/v6611c-ux-vnext-landing]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa-wild-attack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Render-order build preflight
        run: |
          python -m venv /tmp/render-order
          /tmp/render-order/bin/python deploy_ux_vnext.py
      - name: Install dependencies
        run: python -m pip install --quiet -r hosted_runtime_base_v6512/requirements.txt
      - name: Assemble runtime
        run: python deploy_ux_vnext.py
      - name: Wild attack QA Admin
        run: python scripts/wild_attack_qa_admin.py
