name: Bio13 V6611D Intake Contract Trace
on:
  push:
    branches: [ops/bio13-exact100-v6611d-intake-qualification-20260915]
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Reconstruct exact qualified runtime
        shell: bash
        run: |
          set -euo pipefail
          python deploy_v669b_from_env.py | tee /tmp/reconstruct.log
          grep -q 'V6611D_HOSTED_QUALIFICATION_RUNTIME_READY' /tmp/reconstruct.log
          echo '=== RUNTIME IDENTITY ==='
          grep -E 'V6611C_HOSTED_RUNTIME_VERIFIED|V6611D_BRIDGE_OVERLAY_APPLIED|V6611D_HOSTED_QUALIFICATION_RUNTIME_READY' /tmp/reconstruct.log
      - name: Verify capability and compile
        shell: bash
        run: |
          set -euo pipefail
          R=scoremax_runtime_v669b
          grep -q "LIVE_MARKABLE_TYPES={'single_choice','true_false','fill_blank','multiple_select','numerical','matching','ordering','constructed_response'}" "$R/app.py"
          grep -q '"matching_set": "matching"' "$R/question_contract_engine.py"
          grep -q '"ordering_sequence": "ordering"' "$R/question_contract_engine.py"
          grep -q '"short_response": "constructed_response"' "$R/question_contract_engine.py"
          grep -q "if qtype=='matching'" "$R/app.py"
          grep -q "if qtype=='ordering'" "$R/app.py"
          grep -q "if qtype=='constructed_response'" "$R/app.py"
          python -m py_compile "$R"/*.py
          find "$R" -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/v6611d_files.sha256
          sha256sum /tmp/v6611d_files.sha256
      - name: Package reconstructed runtime
        shell: bash
        run: |
          set -euo pipefail
          tar -czf /tmp/scoremax_v6611d_runtime.tar.gz scoremax_runtime_v669b
          sha256sum /tmp/scoremax_v6611d_runtime.tar.gz | tee /tmp/runtime_archive.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: scoremax-v6611d-runtime-bio13-qualification
          path: |
            /tmp/scoremax_v6611d_runtime.tar.gz
            /tmp/runtime_archive.sha256
            /tmp/reconstruct.log
          if-no-files-found: error
          retention-days: 2
