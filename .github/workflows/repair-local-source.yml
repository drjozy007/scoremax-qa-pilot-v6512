name: Offline marking assets - isolated public qualification
on:
  push:
    branches: [qualification/marking-semantic-assets-20260925]
    paths: ['.github/workflows/repair-local-source.yml']
permissions:
  contents: read
jobs:
  source:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Retrieve stronger pinned public CPU comparator without private content
        run: |
          python - <<'PY'
          import urllib.request,json,hashlib,pathlib
          root=pathlib.Path('/tmp/marking-assets');root.mkdir()
          repo='cross-encoder/nli-deberta-v3-small'
          rev='fa2804872c3b4bd748f38c0185cc85775361e735'
          def read(url, limit):
              with urllib.request.urlopen(url,timeout=60) as response:
                  data=response.read(limit+1)
              if len(data)>limit: raise RuntimeError('public asset size bound exceeded')
              return data
          meta=json.loads(read(f'https://huggingface.co/api/models/{repo}/revision/{rev}?blobs=true',2000000))
          assert meta['sha']==rev
          (root/'upstream_manifest.json').write_text(json.dumps(meta,sort_keys=True,indent=2))
          files={x['rfilename']:x for x in meta['siblings']}
          wanted=['config.json','tokenizer.json','tokenizer_config.json','special_tokens_map.json','README.md','onnx/model_quint8_avx2.onnx']
          assert all(n in files for n in wanted),[(n,v.get('size')) for n,v in files.items()]
          total=sum(int(files[n].get('size') or (files[n].get('lfs') or {}).get('size') or 0) for n in wanted)
          assert 0<total<170000000,total
          manifest={}
          for name in wanted:
              entry=files[name];raw=read(f'https://huggingface.co/{repo}/resolve/{rev}/{name}',160000000)
              lfs=entry.get('lfs') or {}
              if lfs.get('sha256'): assert hashlib.sha256(raw).hexdigest()==lfs['sha256'],name
              elif entry.get('blobId'): assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==entry['blobId'],name
              else: raise RuntimeError('missing upstream identity for '+name)
              path=root/'model'/name;path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(raw)
              manifest[name]={'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw)}
          (root/'model_manifest.json').write_text(json.dumps({'repository':repo,'revision':rev,'files':manifest,'qualification':'NOT_QUALIFIED_FOR_MARKING'},sort_keys=True,indent=2))
          (root/'artifact_manifest.json').write_text(json.dumps({str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()},sort_keys=True,indent=2))
          print('PINNED_PUBLIC_MODEL_ASSETS_VERIFIED',json.dumps(manifest,sort_keys=True),'NO_PRIVATE_DATA_NO_INFERENCE_NO_DEPLOYMENT')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: scoremax-pinned-local-marking-comparator
          retention-days: 1
          compression-level: 0
          path: /tmp/marking-assets/
          if-no-files-found: error
