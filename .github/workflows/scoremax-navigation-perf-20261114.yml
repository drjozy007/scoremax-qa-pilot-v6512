name: ScoreMax student navigation performance candidate
on:
  pull_request:
    branches: [fix/scoremax-streamed-backup-20261022]
  push:
    branches: [perf/student-navigation-batch-20261114]
    paths:
      - scripts/scoremax_navigation_perf_delta_20261114.py
      - scripts/scoremax_navigation_grouped_scope_delta_20261114.py
      - scripts/scoremax_navigation_batch_student_evidence_20261114.py
      - scripts/scoremax_mastery_card_projection_20261114.py
      - scripts/scoremax_request_evidence_reuse_20261114.py
      - scripts/scoremax_catalogue_subject_pushdown_20261114.py
      - tests/navigation_perf_20261114/**
      - .github/workflows/scoremax-navigation-perf-20261114.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check delta syntax
        run: python -m py_compile scripts/scoremax_navigation_perf_delta_20261114.py scripts/scoremax_navigation_grouped_scope_delta_20261114.py scripts/scoremax_navigation_batch_student_evidence_20261114.py scripts/scoremax_mastery_card_projection_20261114.py scripts/scoremax_request_evidence_reuse_20261114.py scripts/scoremax_catalogue_subject_pushdown_20261114.py
      - name: Run focused query equivalence tests
        run: python -m unittest discover -s tests/navigation_perf_20261114 -v
      - name: Benchmark baseline and candidate evidence indexing
        run: python tests/navigation_perf_20261114/benchmark_evidence_index.py
      - name: Reconstruct exact accepted ScoreMax runtime without production data
        run: python -B scripts/materialize_scoremax_biology_receiver_20261027.py
      - name: Inspect exact generated student read paths
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          s=Path('scoremax_runtime_v669b/app.py').read_text()
          tree=ast.parse(s)
          for name in ('_subject_map','chapter_mastery_opportunity','db','inject_ui_preferences','practice_scope_placements','learner_answer_evidence','mdcat_subject_map','select_mastery_coverage_questions','mastery_coverage_contract','_chapter_snapshots','question_coverage_nodes','mastery_evidence_band_levels'):
              n=next((x for x in tree.body if isinstance(x,ast.FunctionDef) and x.name==name),None)
              print('=== SCOREMAX_SOURCE',name,'===')
              if n:
                  src=ast.get_source_segment(s,n) or ''
                  print(src[:14000])
              else:print('MISSING')
          PY
      - name: Inspect exact canonical question-type fields
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          for filename, names in (('question_contract_engine.py',{'runtime_type_from_row','canonical_runtime_type'}),('app.py',{'canonical_question_type','question_coverage_nodes'})):
              src=Path('scoremax_runtime_v669b',filename).read_text()
              for n in ast.parse(src).body:
                  if isinstance(n,ast.FunctionDef) and n.name in names:
                      print('SCOREMAX_FIELD_DEPENDENCY='+filename+':'+n.name)
                      print(ast.get_source_segment(src,n))
          PY
      - name: Inspect exact runtime chapter-card assembly
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          path=Path('scoremax_runtime_v669b/ux_student_batch.py')
          source=path.read_text()
          for node in ast.parse(source).body:
              if isinstance(node,ast.FunctionDef) and node.name in {'_chapter_snapshots','_subject_snapshot'}:
                  print('SCOREMAX_CHAPTER_CARD_FN='+node.name)
                  print(ast.get_source_segment(source,node))
          PY
      - name: Inspect residual catalogue and coach hot paths in accepted runtime
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          work={
            'app.py':{'scoremax_coach','scoremax_coach_candidates','inject_ui_preferences','practice_scope_placements','live_question_clause','_programme_scope_sql'},
            'ux_catalogue_browser.py':{'_release_scope_counts','catalogue_subject'},
            'ux_student_batch.py':{'_subject_snapshot','_learn_context'},
          }
          for filename,names in work.items():
              source=Path('scoremax_runtime_v669b',filename).read_text()
              for node in ast.parse(source).body:
                  if isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef)) and node.name in names:
                      snippet=ast.get_source_segment(source,node) or ''
                      print('SCOREMAX_RESIDUAL_SOURCE='+filename+':'+node.name)
                      print(snippet[:22000])
          PY
      - name: Preserve exact baseline runtime for side-by-side route tests
        run: cp -a scoremax_runtime_v669b /tmp/scoremax-nav-baseline
      - name: Apply bounded post-hash performance delta
        run: python -B scripts/scoremax_navigation_perf_delta_20261114.py scoremax_runtime_v669b
      - name: Batch governed inventory lookup on candidate only
        run: python -B scripts/scoremax_navigation_grouped_scope_delta_20261114.py scoremax_runtime_v669b
      - name: Batch immutable eligible chapter evidence on candidate
        run: python -B scripts/scoremax_navigation_batch_student_evidence_20261114.py scoremax_runtime_v669b
      - name: Narrow mastery-card query payload without changing academic rules
        run: python -B scripts/scoremax_mastery_card_projection_20261114.py scoremax_runtime_v669b
      - name: Reuse checksum-validated evidence only within read-only navigation requests
        run: python -B scripts/scoremax_request_evidence_reuse_20261114.py scoremax_runtime_v669b
      - name: Push governed catalogue subject constraint into existing placement SQL
        run: python -B scripts/scoremax_catalogue_subject_pushdown_20261114.py scoremax_runtime_v669b
      - name: Prove idempotence and compiled runtime
        run: |
          python -B scripts/scoremax_navigation_perf_delta_20261114.py scoremax_runtime_v669b
          python -B scripts/scoremax_navigation_grouped_scope_delta_20261114.py scoremax_runtime_v669b
          python -B scripts/scoremax_navigation_batch_student_evidence_20261114.py scoremax_runtime_v669b
          python -B scripts/scoremax_mastery_card_projection_20261114.py scoremax_runtime_v669b
          python -B scripts/scoremax_request_evidence_reuse_20261114.py scoremax_runtime_v669b
          python -B scripts/scoremax_catalogue_subject_pushdown_20261114.py scoremax_runtime_v669b
          python -m py_compile scoremax_runtime_v669b/app.py scoremax_runtime_v669b/ux_student_batch.py
      - name: Verify formal mastery and dependent-evidence exclusions against candidate
        run: python -B -m unittest discover -s tests/biology_receiver_20261027 -p test_formal_mastery_evidence.py -v
      - name: Benchmark actual Flask student routes in separate isolated runtimes
        run: |
          pip install -r scoremax_runtime_v669b/requirements.txt
          python tests/navigation_perf_20261114/benchmark_student_routes.py seed /tmp/scoremax-nav-baseline /tmp/nav-seed/state/scoremax.db --per-chapter 800
          mkdir -p /tmp/nav-base/state /tmp/nav-app/state /tmp/nav-candidate/state
          cp /tmp/nav-seed/state/scoremax.db /tmp/nav-base/state/scoremax.db
          cp /tmp/nav-seed/state/scoremax.db /tmp/nav-app/state/scoremax.db
          cp /tmp/nav-seed/state/scoremax.db /tmp/nav-candidate/state/scoremax.db
          python tests/navigation_perf_20261114/benchmark_student_routes.py measure /tmp/scoremax-nav-baseline /tmp/nav-base/state/scoremax.db --label baseline --profile | tee /tmp/nav-baseline.log
          python tests/navigation_perf_20261114/benchmark_student_routes.py measure scoremax_runtime_v669b /tmp/nav-app/state/scoremax.db --label code-only --profile | tee /tmp/nav-code-only.log
          python tests/navigation_perf_20261114/benchmark_student_routes.py measure scoremax_runtime_v669b /tmp/nav-candidate/state/scoremax.db --label candidate --candidate-indexes --profile | tee /tmp/nav-candidate.log
      - name: Compare synthetic route response performance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          def read(path):
              line=next(line for line in Path(path).read_text().splitlines() if line.startswith('SCOREMAX_ROUTE_BENCH='))
              return json.loads(line.split('=',1)[1])['routes']
          base=read('/tmp/nav-baseline.log')
          code=read('/tmp/nav-code-only.log')
          candidate=read('/tmp/nav-candidate.log')
          for route,b in base.items():
              x=code[route];c=candidate[route]
              assert b['status']==x['status']==c['status']==200,(route,b,x,c)
              assert b['body_sha256']==x['body_sha256']==c['body_sha256'],('CONTENT_CHANGED',route)
              a=b['median_ms'];z=c['median_ms']
              print('SCOREMAX_ROUTE_COMPARISON='+json.dumps({'route':route,'baseline_ms':a,
                   'code_only_ms':x['median_ms'],'candidate_ms':z,'delta_ms':round(z-a,2),
                   'index_additional_ms':round(x['median_ms']-z,2),
                   'improvement_pct':round((a-z)/a*100,1) if a else None},sort_keys=True))
          PY
      - name: Characterize 100800 questions and 1000 distinct students with 100k frozen answers
        run: |
          python tests/navigation_perf_20261114/benchmark_student_routes.py seed /tmp/scoremax-nav-baseline /tmp/nav-100k/state/scoremax.db --per-chapter 2100 --additional-learners 999 --answers-per-learner 100
          python tests/navigation_perf_20261114/benchmark_student_routes.py measure scoremax_runtime_v669b /tmp/nav-100k/state/scoremax.db --label 100k-questions-1000-students --candidate-indexes --profile | tee /tmp/nav-100k.log
          python - <<'PY'
          import json
          from pathlib import Path
          line=next(x for x in Path('/tmp/nav-100k.log').read_text().splitlines()
                    if x.startswith('SCOREMAX_ROUTE_BENCH='))
          routes=json.loads(line.split('=',1)[1])['routes']
          for path,metric in routes.items():
              assert metric['status']==200,(path,metric)
              assert metric['max_ms']<15000,('100K_NAVIGATION_UNACCEPTABLE',path,metric)
              print('SCOREMAX_100K_LEARNER_SCALE_CHARACTERIZATION='+json.dumps({
                'route':path,'questions':100800,'students':1000,
                'saved_answers':102300,'median_ms':metric['median_ms'],
                'max_ms':metric['max_ms'],'single_request_target_met':metric['median_ms']<1500,
                'concurrency_qualified':False,'governed_release_qualified':False},sort_keys=True))
          PY
      - name: Verify canonical runtime entrypoint remains unchanged
        run: |
          python - <<'PY'
          from pathlib import Path
          content=Path('scoremax_runtime_v669b/scoremax_production.py').read_text()
          assert 'SCOREMAX_STUDENT_NAVIGATION_BATCH_20261114' not in content
          print('SCOREMAX_PERFORMANCE_ENTRYPOINT_UNCHANGED')
          PY
