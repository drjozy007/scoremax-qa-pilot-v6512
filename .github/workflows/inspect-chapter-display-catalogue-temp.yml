name: Inspect Chapter Display Catalogue Temp
on:
  push:
    branches: [feature/v6611c-ux-vnext-landing]
    paths: ['.github/workflows/inspect-chapter-display-catalogue-temp.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python deploy_ux_vnext.py
      - name: Extract subject chapter display data
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('scoremax_runtime_v669b')
          subjects=('Biology','Chemistry','Physics')
          for p in sorted(root.rglob('*')):
              if not p.is_file() or p.suffix.lower() not in {'.py','.html','.json','.js'}: continue
              try: text=p.read_text(encoding='utf-8')
              except Exception: continue
              if 'chapter' not in text.lower() or not any(s in text for s in subjects): continue
              lines=text.splitlines(); hits=[i for i,l in enumerate(lines) if any(s in l for s in subjects)]
              if not hits: continue
              print('\n###FILE',p.as_posix())
              shown=set()
              for i in hits:
                  a=max(0,i-10); b=min(len(lines),i+45)
                  if i in shown: continue
                  shown.update(range(a,b))
                  print(f'-- lines {a+1}-{b} --')
                  for j in range(a,b): print(f'{j+1}: {lines[j][:700]}')
          PY
