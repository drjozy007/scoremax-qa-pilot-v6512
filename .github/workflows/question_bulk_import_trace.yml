name: Question Bulk Import Trace
on:
  push:
    branches: [ops/question-bulk-import-trace-20260915]
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trace static question type canonicalization
        shell: bash
        run: |
          set -euo pipefail
          ZIP='SCOREMAX_ONLY_UPLOAD_TO_GITHUB_V6_5_12.zip'
          rm -rf /tmp/scoremax && mkdir -p /tmp/scoremax
          unzip -q "$ZIP" -d /tmp/scoremax
          F=/tmp/scoremax/app.py
          echo '=== CANONICAL TYPE FUNCTION ==='
          line=$(grep -n '^def canonical_question_type' "$F" | head -1 | cut -d: -f1)
          sed -n "${line},$((line+140))p" "$F"
          echo '=== LIVE MARKABLE CONSTANT ==='
          grep -n -A8 -B3 'LIVE_MARKABLE_TYPES' "$F" | head -80 || true
          echo '=== IMPORT ALIASES ==='
          line=$(grep -n '^_IMPORT_CANONICAL_ALIASES' "$F" | head -1 | cut -d: -f1)
          sed -n "${line},$((line+70))p" "$F"
          echo '=== VALIDATE ROW ==='
          line=$(grep -n '^def validate_import_row' "$F" | head -1 | cut -d: -f1)
          sed -n "${line},$((line+120))p" "$F"
          echo '=== PARSE OPTIONS ==='
          line=$(grep -n '^def _parse_import_options' "$F" | head -1 | cut -d: -f1)
          sed -n "${line},$((line+90))p" "$F"