name: Question Bulk Import Trace
on:
  push:
    branches: [ops/question-bulk-import-trace-20260915]
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect direct intake field preservation contract
        shell: bash
        run: |
          set -euo pipefail
          ZIP='SCOREMAX_ONLY_UPLOAD_TO_GITHUB_V6_5_12.zip'
          test -f "$ZIP"
          rm -rf /tmp/scoremax && mkdir -p /tmp/scoremax
          unzip -q "$ZIP" -d /tmp/scoremax
          F=/tmp/scoremax/app.py
          echo '=== NORMALIZER FUNCTIONS ==='
          grep -nE '^def (_normalize_import_row|_read_import_upload|_insert_import_question|validate_import_row)' "$F" || true
          for fn in _normalize_import_row _read_import_upload _insert_import_question; do
            line=$(grep -n "^def $fn" "$F" | head -1 | cut -d: -f1 || true)
            if [ -n "$line" ]; then start=$line; end=$((line+220)); echo "===== $fn ====="; sed -n "${start},${end}p" "$F"; fi
          done
          echo '=== STIMULUS / CONTEXT / EXTRA COLUMNS REFERENCES ==='
          grep -RniE --include='*.py' 'stimulus|context|passage|scenario|source locator|progression|cognitive|mastery|extra_json|raw_row|source_row|import.*json|metadata' /tmp/scoremax | head -1400 || true
          echo '=== QUESTION TABLE SCHEMA ==='
          grep -RniE --include='*.py' --include='*.sql' 'CREATE TABLE.*questions|ALTER TABLE.*questions' /tmp/scoremax | head -400 || true
