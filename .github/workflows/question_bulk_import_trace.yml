name: Question Bulk Import Trace
on:
  push:
    branches: [ops/question-bulk-import-trace-20260915]
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Emergency Direct Intake validation and release gate
        shell: bash
        run: |
          set -euo pipefail
          ZIP='SCOREMAX_ONLY_UPLOAD_TO_GITHUB_V6_5_12.zip'
          test -f "$ZIP"
          rm -rf /tmp/scoremax && mkdir -p /tmp/scoremax
          unzip -q "$ZIP" -d /tmp/scoremax
          F=/tmp/scoremax/app.py
          echo '=== VALIDATE IMPORT ROW ==='
          sed -n '8625,8705p' "$F"
          echo '=== NORMALISE/READ/INSERT ==='
          sed -n '9840,10075p' "$F"
          echo '=== ADMIN IMPORT / CONFIRM / RELEASE ELIGIBLE ==='
          sed -n '10195,10420p' "$F"
          echo '=== EMERGENCY 3000 SCALE TEST ==='
          sed -n '1,220p' /tmp/scoremax/scale_test_v6_4_emergency_3000.py
          echo '=== V6.4 ACCEPTANCE RELEVANT ==='
          grep -n -i -E 'Emergency Direct Intake|3,000|3000|governed release|eligible release|Power House' /tmp/scoremax/V6_4_0_ACCEPTANCE.md /tmp/scoremax/V6_4_0_BUILD_REPORT.md /tmp/scoremax/V6_5_1_ACCEPTANCE.md /tmp/scoremax/V6_5_1_PLATFORM_INTEGRATION_HANDOFF.md | head -300 || true
