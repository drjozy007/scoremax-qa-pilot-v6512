name: Question Bulk Import Trace
on:
  push:
    branches: [ops/question-bulk-import-trace-20260915]
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect packaged ScoreMax question import routes
        shell: bash
        run: |
          set -euo pipefail
          ZIP='SCOREMAX_ONLY_UPLOAD_TO_GITHUB_V6_5_12.zip'
          test -f "$ZIP"
          rm -rf /tmp/scoremax && mkdir -p /tmp/scoremax
          unzip -q "$ZIP" -d /tmp/scoremax
          echo '=== PACKAGE ROOT ==='
          find /tmp/scoremax -maxdepth 3 -type f | head -300
          echo '=== QUESTION IMPORT / BULK / XLSX / CSV ROUTES ==='
          grep -RniE --include='*.py' --include='*.js' --include='*.ts' --include='*.html' --include='*.md' 'xlsx|openpyxl|csv|bulk.*import|import.*question|question.*import|upload.*question|question.*upload|import.*xlsx|excel|spreadsheet|question bank.*upload|question_bank.*import' /tmp/scoremax | head -1800 || true
          echo '=== QUESTION INGEST FUNCTIONS ==='
          grep -RniE --include='*.py' 'def .*import|def .*upload|INSERT INTO .*question|upsert.*question|create.*question|bulk.*question|question.*bank' /tmp/scoremax | head -1800 || true
          echo '=== POWER HOUSE INTEGRATION RECEIVER ==='
          grep -RniE --include='*.py' 'PH_SM_APPROVED_CONTENT|power.house|content-releases|package_download_url|reasoning_seed_id|claim_family_id' /tmp/scoremax | head -1800 || true
