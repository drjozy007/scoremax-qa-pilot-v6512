name: Bio13 Identity Crosswalk Audit Qualification
on:
  push:
    branches: [ops/bio13-identity-crosswalk-audit-20260916]
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Materialize exact current runtime
        run: |
          set -euo pipefail
          python -m py_compile deploy_ux_vnext.py ux_vnext_overlay/ux_bio13_identity_crosswalk_audit.py
          python deploy_ux_vnext.py >/tmp/materialize.log
          python -m py_compile scoremax_runtime_v669b/scoremax_production.py scoremax_runtime_v669b/ux_bio13_identity_crosswalk_audit_runtime.py
          test -f scoremax_runtime_v669b/ux_bio13_identity_crosswalk_audit_runtime.py
          grep -q 'run as _run_bio13_identity_crosswalk_audit' scoremax_runtime_v669b/scoremax_production.py
          grep -q 'SCOREMAX_BIO13_IDENTITY_CROSSWALK_AUDIT_V1 PASS' /tmp/materialize.log
      - name: Prove read-only bounded diagnostic
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s=Path('scoremax_runtime_v669b/ux_bio13_identity_crosswalk_audit_runtime.py').read_text(encoding='utf-8')
          for token in ('scoremax_db_id','source_question_id','power_house_public_id','power_house_source_row'):
              assert token in s,token
          for forbidden in ('stem','answer','explanation','option_text','user_id','full_name','UPDATE ','DELETE ','INSERT ','ALTER ','DROP '):
              assert forbidden not in s,forbidden
          assert 'SCOREMAX_BIO13_IDENTITY_CROSSWALK_AUDIT' in s
          assert 'disabled=true' in s
          assert 'ba8e863c4793f694e5227e5b5525147df5e132ecdce0e5ccf5057ae552178fe5' in s
          assert 'e1ddb25d2213058de86394fa00b119c29b18ac6eb98c285599ee8ca6b1651883' in s
          print('SCOREMAX_BIO13_IDENTITY_AUDIT_QUALIFICATION_PASS read_only=true exact_batch=true triplets_only=true learner_content=false users=false mutation=false off_by_default=true')
          PY
