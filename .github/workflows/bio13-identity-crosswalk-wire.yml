name: Bio13 Identity Crosswalk Wire
on:
  push:
    branches: [ops/bio13-identity-crosswalk-audit-20260916]
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire read-only identity audit once
        run: |
          set -euo pipefail
          if grep -q 'apply_bio13_identity_crosswalk_audit' deploy_ux_vnext.py; then
            echo already_wired
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          p=Path('deploy_ux_vnext.py')
          s=p.read_text(encoding='utf-8')
          imp='from ux_vnext_overlay.ux_emergency_return_recovery import apply_emergency_return_recovery\n'
          add=imp+'from ux_vnext_overlay.ux_bio13_identity_crosswalk_audit import apply_bio13_identity_crosswalk_audit\n'
          assert s.count(imp)==1,s.count(imp)
          s=s.replace(imp,add,1)
          anchor='    apply_admin_rejection_reason_guard(ROOT)\n    _wire_programme_tabs_to_correct_surfaces()\n'
          repl='    apply_admin_rejection_reason_guard(ROOT)\n    apply_bio13_identity_crosswalk_audit(ROOT)\n    _wire_programme_tabs_to_correct_surfaces()\n'
          assert s.count(anchor)==1,s.count(anchor)
          p.write_text(s.replace(anchor,repl,1),encoding='utf-8')
          PY
          python -m py_compile deploy_ux_vnext.py ux_vnext_overlay/ux_bio13_identity_crosswalk_audit.py
          git config user.name 'scoremax-governance-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add deploy_ux_vnext.py
          git commit -m 'Wire read-only Bio13 identity crosswalk audit'
          git push origin HEAD:ops/bio13-identity-crosswalk-audit-20260916
