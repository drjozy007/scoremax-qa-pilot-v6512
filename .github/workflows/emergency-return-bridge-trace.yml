name: Emergency Return Bridge Trace
on:
  push:
    branches: [ops/emergency-return-bridge-trace-20260916]
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Build current runtime
        run: |
          set -euo pipefail
          python deploy_ux_vnext.py
      - name: Inspect contract registry and envelope versioning
        run: |
          set -euo pipefail
          grep -n -A 80 -B 80 "CONTRACTS" scoremax_runtime_v669b/scoremax_integration_v1.py | head -n 900 || true
          grep -R -n -A 100 -B 40 "def validate_payload\|def contract_version\|schema_version" scoremax_runtime_v669b/integration_contracts | head -n 1200 || true
          grep -n -A 60 -B 20 "def _envelope" scoremax_runtime_v669b/scoremax_integration_v1.py
