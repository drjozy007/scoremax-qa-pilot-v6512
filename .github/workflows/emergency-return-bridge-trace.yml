name: Emergency Return Bridge Trace
on:
  push:
    branches: [ops/emergency-return-bridge-trace-20260916]
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Build current runtime
        run: |
          set -euo pipefail
          python deploy_ux_vnext.py
      - name: Inspect incident contract schema
        run: |
          set -euo pipefail
          grep -R -n -C 80 "SM_PH_CONTENT_INCIDENT_V1" scoremax_runtime_v669b | head -n 700
          grep -R -n -C 30 "question_checksum_sha256.*release_checksum_sha256\|release_checksum_sha256.*question_checksum_sha256" scoremax_runtime_v669b | head -n 700 || true
