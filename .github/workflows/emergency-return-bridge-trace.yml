name: Emergency Return Bridge Trace
on:
  push:
    branches: [ops/emergency-return-bridge-trace-20260916]
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Build current runtime
        run: |
          set -euo pipefail
          python deploy_ux_vnext.py
      - name: Inspect exact schema loader selection
        run: |
          set -euo pipefail
          grep -n -A 45 -B 20 "SCHEMA_VERSION" scoremax_runtime_v669b/scoremax_integration_v1.py | head -n 500
          grep -n -A 140 -B 30 "def _strict_envelope_errors" scoremax_runtime_v669b/scoremax_integration_v1.py
          grep -n -A 120 -B 40 "integration_contracts" scoremax_runtime_v669b/scoremax_integration_v1.py | head -n 900
          find scoremax_runtime_v669b/integration_contracts -maxdepth 2 -type f -name 'SM_PH_CONTENT_INCIDENT_V1.schema.json' -print -exec grep -n 'schema_version' {} \;
