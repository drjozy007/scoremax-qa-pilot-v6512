name: Emergency Return Bridge Trace
on:
  push:
    branches: [ops/emergency-return-bridge-trace-20260916]
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Build current runtime
        run: |
          set -euo pipefail
          python deploy_ux_vnext.py
      - name: Inspect contract registry and incident schema
        run: |
          set -euo pipefail
          grep -R -n -C 80 "def validate_payload\|def validate_envelope\|class.*Contract\|schema_version.*contract_version" scoremax_runtime_v669b/integration_contracts scoremax_runtime_v669b/scoremax_integration_v1.py | head -n 900 || true
          cat scoremax_runtime_v669b/integration_contracts/SM_PH_CONTENT_INCIDENT_V1.schema.json
