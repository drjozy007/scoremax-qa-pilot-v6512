name: Emergency Return Bridge Trace
on:
  push:
    branches: [ops/emergency-return-bridge-trace-20260916]
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Build current runtime
        run: |
          set -euo pipefail
          python deploy_ux_vnext.py
          python -m py_compile scoremax_runtime_v669b/app.py scoremax_runtime_v669b/scoremax_ph_bridge_v6611d.py
      - name: Inspect rejection handler and evidence schema
        run: |
          set -euo pipefail
          echo '===REVIEW ROUTE LOCATIONS==='
          grep -R -n -C 30 "admin/questions/.*/review\|admin_question.*review\|review_question" scoremax_runtime_v669b ux_vnext_overlay | head -n 500 || true
          echo '===IMPORT EVIDENCE REFERENCES==='
          grep -R -n -C 12 "content_import_batch_rows\|CREATE TABLE IF NOT EXISTS content_import_batches\|Power House Public ID\|Power House Source Row" scoremax_runtime_v669b | head -n 800 || true
          echo '===BRIDGE INCIDENT FUNCTION==='
          grep -n -A 110 -B 15 "def queue_reported_question_incident" scoremax_runtime_v669b/scoremax_ph_bridge_v6611d.py
          echo '===APP REVIEW STATUS MUTATIONS==='
          grep -R -n -C 15 "review_status.*Rejected\|Rejected.*review_status\|status.*Rejected\|Rejected.*status" scoremax_runtime_v669b | head -n 500 || true
