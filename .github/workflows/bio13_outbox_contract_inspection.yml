name: Bio13 Outbox Contract Inspection
on:
  push:
    branches: [ops/bio13-return-lane-20260916]
    paths: ['.github/workflows/bio13_outbox_contract_inspection.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Build exact live runtime and print integration contract
        run: |
          set -euo pipefail
          python deploy_ux_vnext.py >/tmp/build.log
          python - <<'PY'
          from pathlib import Path
          root=Path('scoremax_runtime_v669b')
          for name in ('scoremax_integration_v1.py','scoremax_ph_bridge_v6611d.py'):
              p=root/name
              if not p.is_file():
                  raise SystemExit('MISSING:'+name)
              print('===',name,'===')
              lines=p.read_text(encoding='utf-8').splitlines()
              for i,line in enumerate(lines,1):
                  if any(x in line for x in ('def _queue','def queue','integration_outbox','idempot','dispatch_due','message_id','UNIQUE','CREATE TABLE')):
                      a=max(1,i-12); b=min(len(lines),i+36)
                      for j in range(a,b+1): print(f'{j:05d}: {lines[j-1]}')
                      print('---')
          PY
