name: Inspect Integration Dispatcher Temp
on:
  push:
    branches: [feature/v6611c-ux-vnext-landing]
    paths: ['.github/workflows/inspect-integration-dispatch-temp.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python deploy_ux_vnext.py
      - name: Inspect dispatcher contract without values
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scoremax_runtime_v669b/scoremax_integration_v1.py')
          t=p.read_text()
          needles=('def _dispatch_target','def dispatch','def _dispatch','outbox','SCOREMAX_POWER_HOUSE_BASE_URL','POWER_HOUSE','HMAC','SECRET','SIGN')
          lines=t.splitlines()
          for i,line in enumerate(lines,1):
              if any(n in line for n in needles):
                  print(f'{i}: {line[:300]}')
          PY
