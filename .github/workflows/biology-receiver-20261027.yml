name: ScoreMax Biology receiver delta
on:
  push:
    branches: [fix/scoremax-streamed-backup-20261022]
    paths:
      - scripts/materialize_scoremax_biology_receiver_20261027.py
      - scripts/qualify_native_manifest_pull.py
      - ux_vnext_overlay/biology_receiver_20261027/**
      - tests/biology_receiver_20261027/**
      - .github/workflows/biology-receiver-20261027.yml
permissions:
  contents: read
jobs:
  receiver_delta:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reuse accepted public source and materialise Biology-only delta
        run: python -B scripts/materialize_scoremax_biology_receiver_20261027.py --keep-accepted-source
      - name: Build only the targeted receiver harness
        run: timeout 240 docker build -f tests/biology_receiver_20261027/Dockerfile -t scoremax-biology-receiver .
      - name: Reproduce gaps, verify fixes and affected regressions with network disabled
        run: |
          mkdir -p biology-receiver-evidence
          timeout 180 docker run --rm --network none --memory=2g --memory-swap=2g --cpus=1 --tmpfs /data:rw,size=1g -v "$PWD/biology-receiver-evidence:/evidence" scoremax-biology-receiver
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scoremax-biology-receiver-${{ github.sha }}
          path: biology-receiver-evidence/
          retention-days: 14
