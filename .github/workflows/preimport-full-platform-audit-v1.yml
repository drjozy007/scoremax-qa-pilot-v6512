name: Pre-Import Full Platform Qualification v1
on:
  push:
    branches: [qualification/local-followup-gates-20260924]
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify and apply the retained no-paid-API candidate in disposable checkout
        run: |
          set -euo pipefail
          mkdir -p /tmp/scoremax_followup_evidence
          git rev-parse HEAD > /tmp/scoremax_followup_evidence/qualification_commit.txt
          test "$(git rev-parse HEAD^)" = 7cf0028b23aaacdde0b4db5fa03cb9953a6c7115
          python - <<'PY'
          import base64,hashlib,lzma,pathlib,subprocess
          data=base64.b64decode(pathlib.Path('qualification/local_followup_v1.patch.xz.b64').read_text())
          patch=lzma.decompress(data)
          assert hashlib.sha256(patch).hexdigest()=='30a6e27c3c2480efc822201b1c2f8842b06489d9f04f5c3b23c293e482096490'
          path=pathlib.Path('/tmp/scoremax_followup_evidence/retained_candidate.patch');path.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(path)],check=True)
          subprocess.run(['git','apply',str(path)],check=True)
          print('EXACT_RETAINED_NO_PAID_API_PATCH_VERIFIED')
          PY
          python scripts/qualify_build_determinism.py --report /tmp/scoremax_followup_evidence/build.json
          python - <<'PY'
          from pathlib import Path
          import shutil,json,hashlib
          src=Path('scoremax_runtime_v669b');out=Path('/tmp/scoremax_followup_evidence/runtime');manifest={}
          for p in sorted(src.rglob('*')):
              if not p.is_file() or '__pycache__' in p.parts or p.suffix=='.pyc':continue
              assert p.suffix not in ('.db','.sqlite','.sqlite3')
              dst=out/p.relative_to(src);dst.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(p,dst)
              manifest[p.relative_to(src).as_posix()]=hashlib.sha256(p.read_bytes()).hexdigest()
          Path('/tmp/scoremax_followup_evidence/runtime_manifest.json').write_text(json.dumps(manifest,sort_keys=True,indent=2))
          PY
      - name: Install the established runtime and browser dependencies
        id: dependencies
        run: |
          pip install -r scoremax_runtime_v669b/requirements.txt
          pip install playwright==1.57.0 cryptography==46.0.4
          pip download --no-deps Flask==3.1.3 Werkzeug==3.1.6 blinker==1.9.0 itsdangerous==2.2.0 click==8.2.1 -d /tmp/scoremax_followup_evidence/wheels
          if command -v google-chrome >/dev/null; then
            echo "CHROMIUM_EXECUTABLE=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null; then
            echo "CHROMIUM_EXECUTABLE=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            python -m playwright install --with-deps chromium
          fi
      - name: Original 211 native regressions and retained 52 local follow-up tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          python - <<'PY'
          import subprocess,sys,json,pathlib
          root=pathlib.Path('/tmp/scoremax_followup_evidence');results=[]
          scripts=['qualify_account_startup_repair','qualify_assessment_contract_repair','qualify_written_entrypoints','qualify_programme_navigation_repair','qualify_existing_ph_compatibility','qualify_written_local_followup']
          for name in scripts:
              with (root/(name+'.log')).open('w') as log:
                  p=subprocess.run([sys.executable,'scripts/'+name+'.py','--report',str(root/(name+'.json'))],stdout=log,stderr=subprocess.STDOUT)
              results.append({'suite':name,'returncode':p.returncode});print(name,p.returncode,flush=True)
              if p.returncode:print((root/(name+'.log')).read_text()[-12000:])
          (root/'regression_outcomes.json').write_text(json.dumps(results,indent=2))
          raise SystemExit(any(r['returncode'] for r in results))
          PY
      - name: Real Flask written follow-up and nine real browser submissions
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          set -o pipefail
          python scripts/qualify_written_followup_web.py --browser --report /tmp/scoremax_followup_evidence/written_web.json --screenshots /tmp/scoremax_followup_evidence/written_screenshots 2>&1 | tee /tmp/scoremax_followup_evidence/written_web.log
      - name: Existing real browser assessment and programme navigation regressions
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          python - <<'PY'
          import subprocess,sys,pathlib
          out=pathlib.Path('/tmp/scoremax_followup_evidence');failed=False
          for name in ('qualify_assessment_browser','qualify_programme_mastery_browser'):
              with (out/(name+'.log')).open('w') as log:
                  p=subprocess.run([sys.executable,'scripts/'+name+'.py','--report',str(out/(name+'.json')),'--screenshots',str(out/(name+'_screenshots'))],stdout=log,stderr=subprocess.STDOUT)
              print(name,p.returncode,flush=True);failed|=bool(p.returncode)
              if p.returncode:print((out/(name+'.log')).read_text()[-12000:])
          raise SystemExit(failed)
          PY
      - name: Established route and Power House boundary gates
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          python - <<'PY'
          import subprocess,sys,pathlib,os,shutil
          out=pathlib.Path('/tmp/scoremax_followup_evidence');failed=False
          for name in ('preimport_full_platform_audit','preimport_governance_gates'):
              state=pathlib.Path('/tmp')/('followup_'+name)
              for part in ('state','backup','intake'):(state/part).mkdir(parents=True,exist_ok=True)
              env=dict(os.environ,SCOREMAX_ENV='production',SCOREMAX_DB=str(state/'state/scoremax.db'),SCOREMAX_PERSISTENT_ROOT=str(state),SCOREMAX_BACKUP_DIR=str(state/'backup'),SCOREMAX_CONTENT_INTAKE_DIR=str(state/'intake'),SCOREMAX_SECRET='synthetic-ci-only-followup-no-live',SCOREMAX_STAGING_SESSION_SECRET='synthetic-ci-only-followup-no-live',SCOREMAX_BOOTSTRAP_ADMIN_PASSWORD='Synthetic-Only-Qualification-2026!',SCOREMAX_SMTP_HOST='smtp.invalid',SCOREMAX_SMTP_FROM='qualification@scoremax.test',SCOREMAX_PUBLIC_BASE_URL='https://localhost',SCOREMAX_INSTANCE_COUNT='1',WEB_CONCURRENCY='1',SCOREMAX_REQUIRE_EMAIL_VERIFICATION='0',SCOREMAX_ENFORCE_PAYWALL='0')
              shutil.copyfile('scripts/'+name+'.py','scoremax_runtime_v669b/'+name+'.py')
              wrapper="import socket,runpy\ndef deny(*a,**k):raise RuntimeError('QUALIFICATION_NETWORK_DISABLED')\nsocket.socket.connect=deny;socket.socket.connect_ex=deny\nrunpy.run_path('"+name+".py',run_name='__main__')"
              with (out/(name+'.log')).open('w') as log:p=subprocess.run([sys.executable,'-c',wrapper],cwd='scoremax_runtime_v669b',env=env,stdout=log,stderr=subprocess.STDOUT)
              print(name,p.returncode,flush=True);failed|=bool(p.returncode)
              if p.returncode:print((out/(name+'.log')).read_text()[-12000:])
          for p in pathlib.Path('/tmp').glob('scoremax_preimport*.json'):shutil.copyfile(p,out/p.name)
          raise SystemExit(failed)
          PY
      - name: Retain exact revision-bound evidence (no live records or runtime databases)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scoremax-no-paid-api-followup-gates-20260924
          path: /tmp/scoremax_followup_evidence/
          if-no-files-found: error
          retention-days: 14
