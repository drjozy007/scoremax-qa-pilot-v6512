name: Pre-Import Full Platform Qualification v1

on:
  push:
    branches: [feature/v6611c-ux-vnext-landing, repair/account-startup-20260922]
    paths:
      - '.github/workflows/preimport-full-platform-audit-v1.yml'
      - 'scripts/preimport_full_platform_audit.py'
      - 'scripts/preimport_governance_gates.py'
      - 'scripts/qualify_account_startup_repair.py'
      - 'scripts/qualify_build_determinism.py'
      - 'deploy_ux_vnext.py'
      - 'ux_vnext_overlay/**'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      SCOREMAX_ENV: production
      SCOREMAX_SECRET: synthetic-ci-only-account-startup-repair-secret
      SCOREMAX_STAGING_SESSION_SECRET: synthetic-ci-only-account-startup-repair-secret
      SCOREMAX_BOOTSTRAP_ADMIN_PASSWORD: Synthetic-Only-Qualification-2026!
      SCOREMAX_SMTP_HOST: smtp.invalid
      SCOREMAX_SMTP_FROM: qualification@scoremax.test
      SCOREMAX_PUBLIC_BASE_URL: https://localhost
      SCOREMAX_INSTANCE_COUNT: '1'
      WEB_CONCURRENCY: '1'
      SCOREMAX_REQUIRE_EMAIL_VERIFICATION: '0'
      SCOREMAX_ENFORCE_PAYWALL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Materialize exact triggering candidate
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD > /tmp/scoremax_qualified_commit.txt
          python scripts/qualify_build_determinism.py --report /tmp/scoremax_build_determinism.json
          mkdir -p /tmp/scoremax_qualified_source
          cp scoremax_runtime_v669b/{app.py,account_security_engine.py,scoremax_production.py} /tmp/scoremax_qualified_source/
          sha256sum /tmp/scoremax_qualified_source/*.py > /tmp/scoremax_qualified_source/SHA256SUMS.txt
      - name: Install runtime dependencies
        id: dependencies
        run: pip install -r scoremax_runtime_v669b/requirements.txt
      - name: Qualify account revocation and actual cold/restarted WSGI
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: python scripts/qualify_account_startup_repair.py --report /tmp/scoremax_account_startup_repair.json
      - name: Run pre-import route and template audit
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        env:
          SCOREMAX_DB: /tmp/scoremax_preimport_full_v1/state/scoremax.db
          SCOREMAX_PERSISTENT_ROOT: /tmp/scoremax_preimport_full_v1
          SCOREMAX_BACKUP_DIR: /tmp/scoremax_preimport_full_v1/backup
          SCOREMAX_CONTENT_INTAKE_DIR: /tmp/scoremax_preimport_full_v1/intake
        run: |
          rm -rf /tmp/scoremax_preimport_full_v1
          mkdir -p /tmp/scoremax_preimport_full_v1/{state,backup,intake}
          cp scripts/preimport_full_platform_audit.py scoremax_runtime_v669b/preimport_full_platform_audit.py
          cd scoremax_runtime_v669b
          python - <<'PY'
          import socket, runpy
          def no_network(*args, **kwargs):
              raise RuntimeError('QUALIFICATION_NETWORK_DISABLED')
          socket.socket.connect = no_network
          socket.socket.connect_ex = no_network
          runpy.run_path('preimport_full_platform_audit.py', run_name='__main__')
          PY
      - name: Run Power House boundary and zero-content gates
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        env:
          SCOREMAX_DB: /tmp/scoremax_preimport_governance_v1/state/scoremax.db
          SCOREMAX_PERSISTENT_ROOT: /tmp/scoremax_preimport_governance_v1
          SCOREMAX_BACKUP_DIR: /tmp/scoremax_preimport_governance_v1/backup
          SCOREMAX_CONTENT_INTAKE_DIR: /tmp/scoremax_preimport_governance_v1/intake
        run: |
          rm -rf /tmp/scoremax_preimport_governance_v1
          mkdir -p /tmp/scoremax_preimport_governance_v1/{state,backup,intake}
          cp scripts/preimport_governance_gates.py scoremax_runtime_v669b/preimport_governance_gates.py
          cd scoremax_runtime_v669b
          python - <<'PY' | tee /tmp/scoremax_preimport_governance.log
          import socket, runpy
          def no_network(*args, **kwargs):
              raise RuntimeError('QUALIFICATION_NETWORK_DISABLED')
          socket.socket.connect = no_network
          socket.socket.connect_ex = no_network
          runpy.run_path('preimport_governance_gates.py', run_name='__main__')
          PY
      - name: Publish revision-bound qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scoremax-preimport-full-platform-audit-v1
          path: |
            /tmp/scoremax_qualified_commit.txt
            /tmp/scoremax_build_determinism.json
            /tmp/scoremax_qualified_source/
            /tmp/scoremax_account_startup_repair.json
            /tmp/scoremax_preimport_audit.json
            /tmp/scoremax_preimport_governance.log
          if-no-files-found: error
          retention-days: 14
