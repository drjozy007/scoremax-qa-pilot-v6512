name: Pre-Import Full Platform Qualification v1

on:
  push:
    branches: [feature/v6611c-ux-vnext-landing]
    paths:
      - '.github/workflows/preimport-full-platform-audit-v1.yml'
      - 'scripts/preimport_full_platform_audit.py'
      - 'scripts/preimport_governance_gates.py'
      - 'deploy_ux_vnext.py'
      - 'ux_vnext_overlay/**'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v6611c-ux-vnext-landing
          fetch-depth: 0
      - name: Materialize exact staging candidate
        run: python deploy_ux_vnext.py
      - name: Trace pre-import residual sources
        run: |
          echo '=== SYNTHETIC CONTENT SOURCE ==='
          grep -R -n --exclude='*.pyc' --exclude='*.db' --exclude='*.sqlite*' -E 'Demo Chapter|Foundation workflow|BIO001|demo_seed_allowed|synthetic qualification population disabled' scoremax_runtime_v669b || true
          echo '=== LOGIN ASSET REFERENCES ==='
          grep -R -n 'ux_seaweed_trial.css' scoremax_runtime_v669b ux_vnext_overlay || true
      - name: Install runtime dependencies
        run: pip install -r scoremax_runtime_v669b/requirements.txt
      - name: Run exhaustive pre-import audit
        env:
          SCOREMAX_ENV: local
          SCOREMAX_STAGING_SESSION_SECRET: full-platform-preimport-v1
          SCOREMAX_DB: /tmp/scoremax_preimport_full_v1.db
          SCOREMAX_PERSISTENT_ROOT: /tmp/scoremax_preimport_full_v1
          SCOREMAX_BACKUP_DIR: /tmp/scoremax_preimport_full_v1/backup
          SCOREMAX_CONTENT_INTAKE_DIR: /tmp/scoremax_preimport_full_v1/intake
          SCOREMAX_PUBLIC_BASE_URL: http://localhost
          SCOREMAX_REQUIRE_EMAIL_VERIFICATION: '0'
          SCOREMAX_ENFORCE_PAYWALL: '0'
        run: |
          rm -rf /tmp/scoremax_preimport_full_v1
          mkdir -p /tmp/scoremax_preimport_full_v1/backup /tmp/scoremax_preimport_full_v1/intake
          cp scripts/preimport_full_platform_audit.py scoremax_runtime_v669b/preimport_full_platform_audit.py
          cd scoremax_runtime_v669b
          python preimport_full_platform_audit.py
      - name: Run Power House boundary and zero-content gates
        env:
          SCOREMAX_ENV: local
          SCOREMAX_STAGING_SESSION_SECRET: full-platform-preimport-v1
          SCOREMAX_DB: /tmp/scoremax_preimport_governance_v1.db
          SCOREMAX_PERSISTENT_ROOT: /tmp/scoremax_preimport_governance_v1
          SCOREMAX_BACKUP_DIR: /tmp/scoremax_preimport_governance_v1/backup
          SCOREMAX_CONTENT_INTAKE_DIR: /tmp/scoremax_preimport_governance_v1/intake
          SCOREMAX_PUBLIC_BASE_URL: http://localhost
          SCOREMAX_REQUIRE_EMAIL_VERIFICATION: '0'
          SCOREMAX_ENFORCE_PAYWALL: '0'
        run: |
          rm -rf /tmp/scoremax_preimport_governance_v1
          mkdir -p /tmp/scoremax_preimport_governance_v1/backup /tmp/scoremax_preimport_governance_v1/intake
          cp scripts/preimport_governance_gates.py scoremax_runtime_v669b/preimport_governance_gates.py
          cd scoremax_runtime_v669b
          python preimport_governance_gates.py
      - name: Publish audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scoremax-preimport-full-platform-audit-v1
          path: /tmp/scoremax_preimport_audit.json
          if-no-files-found: warn
