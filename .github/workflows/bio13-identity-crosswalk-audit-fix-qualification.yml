name: Bio13 Identity Crosswalk Audit Fix Qualification
on:
  push:
    branches: [ops/bio13-identity-crosswalk-audit-fix-20260916]
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Qualify governed row_json audit path
        run: |
          set -euo pipefail
          python -m py_compile deploy_ux_vnext.py ux_vnext_overlay/ux_bio13_identity_crosswalk_audit.py
          python deploy_ux_vnext.py >/tmp/materialize.log
          python -m py_compile scoremax_runtime_v669b/ux_bio13_identity_crosswalk_audit_runtime.py scoremax_runtime_v669b/scoremax_production.py
          python - <<'PY'
          from pathlib import Path
          s=Path('scoremax_runtime_v669b/ux_bio13_identity_crosswalk_audit_runtime.py').read_text(encoding='utf-8')
          assert 'content_import_batch_rows' in s
          assert 'row_json' in s
          assert 'provenance_note' not in s
          assert "r.import_status='IMPORTED'" in s
          for forbidden in ('stem','answer','explanation','option_text','UPDATE ','DELETE ','INSERT ','ALTER ','DROP '): assert forbidden not in s,forbidden
          print('SCOREMAX_BIO13_IDENTITY_AUDIT_ROW_JSON_FIX_PASS sender_source_reused=true read_only=true')
          PY
