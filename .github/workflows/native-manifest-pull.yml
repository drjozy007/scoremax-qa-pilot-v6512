name: Native signed manifest pull
on:
  pull_request:
    paths:
      - 'deploy_ux_vnext.py'
      - 'ux_vnext_overlay/native_manifest_pull_v1.py'
      - 'scripts/qualify_native_manifest_pull.py'
      - '.github/workflows/native-manifest-pull.yml'
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python deploy_ux_vnext.py
      - run: pip install -r scoremax_runtime_v669b/requirements.txt cryptography
      - run: python scripts/qualify_native_manifest_pull.py
      - run: python scripts/qualify_guided_self_assessment.py
