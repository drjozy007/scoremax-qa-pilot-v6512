name: V6611D Governed PH Bridge Qualification
on:
  push:
    branches: [feature/v6611d-ph-delivery-incident-bridge-20260907]
  workflow_dispatch:
jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest Flask==3.1.0 'Pillow>=10.0,<12' Werkzeug==3.1.3 'gunicorn>=22,<24' 'jsonschema>=4.23,<5' openpyxl==3.1.5
      - name: Reconstruct exact V6611C parent
        run: python deploy_v669b_from_env.py
      - name: Apply governed V6611D overlay
        run: python apply_v6611d_bridge_overlay.py scoremax_runtime_v669b | tee /tmp/v6611d_overlay.txt
      - name: Assert markers and no direct learner-path transport
        shell: bash
        run: |
          set -eu
          grep -q 'SM-PH-BRIDGE-V6611D-1' scoremax_runtime_v669b/V6611D_PH_BRIDGE_MARKER.json
          grep -q "SCOREMAX_RELEASE_VERSION='6.6.11D'" scoremax_runtime_v669b/app.py
          grep -q "SCOREMAX_INTEGRATION_RELEASE='6.6.11D'" scoremax_runtime_v669b/scoremax_integration_v1.py
          ! grep -nE 'urlopen|requests\.|httpx\.' scoremax_runtime_v669b/scoremax_ph_bridge_v6611d.py
          grep -q '/api/integration/v1/power-house/question-withdrawals' scoremax_runtime_v669b/app.py
      - name: Run V6611D regression suite
        env:
          V6611D_RUNTIME: scoremax_runtime_v669b
        run: python -m pytest -q v6611d_bridge/tests/test_v6611d_bridge.py
      - name: Prove parent hash guard fails closed
        shell: bash
        run: |
          set -eu
          python deploy_v669b_from_env.py
          printf '\n# MUTATION FOR HASH-GUARD TEST\n' >> scoremax_runtime_v669b/app.py
          set +e
          python apply_v6611d_bridge_overlay.py scoremax_runtime_v669b >/tmp/hash_guard.out 2>&1
          rc=$?
          set -e
          test "$rc" -ne 0
          grep -q 'V6611D_PARENT_TREE_SHA_MISMATCH' /tmp/hash_guard.out
          echo 'V6611D_PARENT_HASH_GUARD_PASS'
