name: V6611D Bridge Inspection
on:
  push:
    branches: [feature/v6611d-ph-delivery-incident-bridge-20260907]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct exact V6611C and inspect patch anchors
        shell: bash
        run: |
          set -eu
          python deploy_v669b_from_env.py
          ROOT=scoremax_runtime_v669b
          echo '=== APP CONTENT ROUTES 7080-7135 ==='
          sed -n '7080,7135p' "$ROOT/app.py"
          echo '=== INTEGRATION SCHEMA HELPERS 1-180 ==='
          sed -n '1,180p' "$ROOT/scoremax_integration_v1.py"
          echo '=== ACTIVATE RELEASE 1140-1215 ==='
          sed -n '1140,1215p' "$ROOT/scoremax_integration_v1.py"
          echo '=== DISPATCH 1960-2085 ==='
          sed -n '1960,2085p' "$ROOT/scoremax_integration_v1.py"
          echo '=== INIT SCHEMA CALLS IN APP ==='
          grep -nE 'integration_v1.init_schema|def init\(' "$ROOT/app.py" | head -n 30
