name: ScoreMax bounded public onboarding
on:
  push:
    branches: [fix/scoremax-streamed-backup-20261022]
    paths:
      - scripts/materialize_scoremax_public_opening_20261026.py
      - ux_vnext_overlay/ux_public_student_opening_20261026.py
      - ux_vnext_overlay/public_opening_20261026/**
      - tests/public_student_opening_20261026/**
      - .github/workflows/public-student-opening-20261026.yml
permissions:
  contents: read
jobs:
  public_opening:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reuse accepted source and add bounded public onboarding only
        run: python -B scripts/materialize_scoremax_public_opening_20261026.py
      - name: Build affected native Linux runtime
        run: timeout 240 docker build -f tests/public_student_opening_20261026/Dockerfile -t scoremax-public-opening .
      - name: Verify new public admission and native email registration without network
        run: |
          mkdir -p public-opening-evidence
          timeout 120 docker run --rm --network none --memory=2g --memory-swap=2g --cpus=1 --tmpfs /data:rw,size=1g -v "$PWD/public-opening-evidence:/evidence" scoremax-public-opening
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scoremax-public-opening-${{ github.sha }}
          path: public-opening-evidence/
          retention-days: 14
