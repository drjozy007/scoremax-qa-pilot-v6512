name: Wild audit offline dependencies
on:
  push:
    branches: [audit/wild-preimport-20260922]
    paths: ['.github/workflows/wild-audit-offline-dependencies.yml']
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download test environment wheels only
        run: |
          mkdir -p /tmp/wild-wheels
          python -m pip download --only-binary=:all: --dest /tmp/wild-wheels Flask==3.1.3 Werkzeug==3.1.6 'gunicorn>=22,<24'
      - uses: actions/upload-artifact@v4
        with:
          name: wild-audit-offline-web-dependencies
          path: /tmp/wild-wheels/
          retention-days: 7
