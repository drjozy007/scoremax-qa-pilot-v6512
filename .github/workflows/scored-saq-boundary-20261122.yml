name: Scored SAQ boundary qualification
on:
  pull_request:
    paths:
      - 'ux_vnext_overlay/biology_receiver_20261027/scored_saq_*.py'
      - 'ux_vnext_overlay/biology_receiver_20261027/work_b_receiver*'
      - 'tests/biology_receiver_20261027/*pending*'
      - 'tests/biology_receiver_20261027/*work_b*'
      - 'tests/biology_receiver_20261027/native_delivery_fixture.py'
      - 'scripts/materialize_scoremax_scored_saq_20261122.py'
      - 'tests/biology_receiver_20261027/*scored*.py'
      - '.github/workflows/scored-saq-boundary-20261122.yml'
      - '.gitattributes'
      - 'ux_vnext_overlay/biology_receiver_20261027/shared_practice_runtime.py'
      - 'ux_vnext_overlay/biology_receiver_20261027/shared_ph_guided_admission_20261031.py'
  workflow_dispatch:
env:
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  qualification:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assemble exact accepted receiver
        run: python -B scripts/materialize_scoremax_biology_receiver_20261027.py
      - name: Accepted programme resolver regression
        run: python -B -m unittest discover -s tests/biology_receiver_20261027 -p test_programme_resolution_cache.py -q
      - name: Assemble bounded scored SAQ candidate
        run: python -B scripts/materialize_scoremax_scored_saq_20261122.py
      - name: Install accepted runtime dependencies
        run: python -m pip install -r scoremax_runtime_v669b/requirements.txt
      - name: Contract and marker qualification
        run: python -B -m unittest discover -s tests/biology_receiver_20261027 -p test_scored_saq_v1.py -v
      - name: Native saved submissions and 1 10 50 concurrency
        run: python -B tests/biology_receiver_20261027/qualify_scored_native_submissions_v1.py
      - name: Exact receiver continuation build and rollback source controls
        run: python -B -m unittest discover -s tests/biology_receiver_20261027 -p test_work_b_receiver_build_v2.py -v
      - name: Pending learner label exact build and source rollback
        run: python -B -m unittest discover -s tests/biology_receiver_20261027 -p test_work_b_receiver_header_v3.py -v
      - name: Native pending responses preserve source marks and weight
        run: python -B tests/biology_receiver_20261027/qualify_pending_saq_native_v3.py pending_saq_native_ci.json
      - name: Actual learner browse setup start and unscored submit
        run: python -B tests/biology_receiver_20261027/qualify_pending_browser_journey_v3.py scoremax_runtime_v669b qualification/pending_browser_state pending_browser_native_ci.json
      - name: Native signed release withdrawal races and recovery
        run: python -B tests/biology_receiver_20261027/qualify_work_b_delivery_recovery_v2.py delivery_recovery_native_ci.json
      - name: Separate signed pending contract adversarial controls
        run: python -B tests/biology_receiver_20261027/qualify_pending_saq_adversarial_v1.py pending_saq_adversarial_ci.json
