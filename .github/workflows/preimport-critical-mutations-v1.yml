name: Pre-Import Critical Mutations v1

on:
  push:
    branches: [feature/v6611c-ux-vnext-landing]
    paths:
      - '.github/workflows/preimport-critical-mutations-v1.yml'
      - 'scripts/preimport_mutation_*.py'
      - 'deploy_ux_vnext.py'
      - 'ux_vnext_overlay/**'

permissions:
  contents: read

jobs:
  mutations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v6611c-ux-vnext-landing
          fetch-depth: 0
      - name: Materialize exact candidate
        run: python deploy_ux_vnext.py
      - name: Install dependencies
        run: pip install -r scoremax_runtime_v669b/requirements.txt
      - name: Core classroom and learner mutations
        env:
          SCOREMAX_ENV: local
          SCOREMAX_STAGING_SESSION_SECRET: mutation-core-v1
          SCOREMAX_DB: /tmp/scoremax_mut_core.db
          SCOREMAX_PERSISTENT_ROOT: /tmp/scoremax_mut_core
          SCOREMAX_BACKUP_DIR: /tmp/scoremax_mut_core/backup
          SCOREMAX_CONTENT_INTAKE_DIR: /tmp/scoremax_mut_core/intake
          SCOREMAX_PUBLIC_BASE_URL: http://localhost
          SCOREMAX_REQUIRE_EMAIL_VERIFICATION: '0'
          SCOREMAX_ENFORCE_PAYWALL: '0'
        run: |
          rm -rf /tmp/scoremax_mut_core && mkdir -p /tmp/scoremax_mut_core/backup /tmp/scoremax_mut_core/intake
          cp scripts/preimport_mutation_core.py scoremax_runtime_v669b/preimport_mutation_core.py
          cd scoremax_runtime_v669b && python preimport_mutation_core.py
      - name: Commercial configuration and checkout mutations
        env:
          SCOREMAX_ENV: local
          SCOREMAX_STAGING_SESSION_SECRET: mutation-commercial-v1
          SCOREMAX_DB: /tmp/scoremax_mut_commercial.db
          SCOREMAX_PERSISTENT_ROOT: /tmp/scoremax_mut_commercial
          SCOREMAX_BACKUP_DIR: /tmp/scoremax_mut_commercial/backup
          SCOREMAX_CONTENT_INTAKE_DIR: /tmp/scoremax_mut_commercial/intake
          SCOREMAX_PUBLIC_BASE_URL: http://localhost
          SCOREMAX_REQUIRE_EMAIL_VERIFICATION: '0'
          SCOREMAX_ENFORCE_PAYWALL: '0'
        run: |
          rm -rf /tmp/scoremax_mut_commercial && mkdir -p /tmp/scoremax_mut_commercial/backup /tmp/scoremax_mut_commercial/intake
          cp scripts/preimport_mutation_commercial.py scoremax_runtime_v669b/preimport_mutation_commercial.py
          cd scoremax_runtime_v669b && python preimport_mutation_commercial.py
      - name: Interest capture and import fail-safe mutations
        env:
          SCOREMAX_ENV: local
          SCOREMAX_STAGING_SESSION_SECRET: mutation-intake-v1
          SCOREMAX_DB: /tmp/scoremax_mut_intake.db
          SCOREMAX_PERSISTENT_ROOT: /tmp/scoremax_mut_intake
          SCOREMAX_BACKUP_DIR: /tmp/scoremax_mut_intake/backup
          SCOREMAX_CONTENT_INTAKE_DIR: /tmp/scoremax_mut_intake/intake
          SCOREMAX_PUBLIC_BASE_URL: http://localhost
          SCOREMAX_REQUIRE_EMAIL_VERIFICATION: '0'
          SCOREMAX_ENFORCE_PAYWALL: '0'
        run: |
          rm -rf /tmp/scoremax_mut_intake && mkdir -p /tmp/scoremax_mut_intake/backup /tmp/scoremax_mut_intake/intake
          cp scripts/preimport_mutation_intake.py scoremax_runtime_v669b/preimport_mutation_intake.py
          cd scoremax_runtime_v669b && python preimport_mutation_intake.py
