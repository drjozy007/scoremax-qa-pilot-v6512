name: PH Reasoning Seed Consumption Trace
on:
  push:
    branches: [ops/ph-reasoning-seed-consumption-trace-20260914]
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect packaged ScoreMax runtime
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/sm && mkdir /tmp/sm
          unzip -q SCOREMAX_ONLY_UPLOAD_TO_GITHUB_V6_5_12.zip -d /tmp/sm
          cd /tmp/sm
          echo '=== PH SEED METADATA CONSUMERS ==='
          grep -RniE --include='*.py' 'ph_reasoning_seed_id|ph_claim_family_id' . | head -2500 || true
          echo '=== UNIVERSAL UPSERT/MAPPING CALLS OUTSIDE TESTS ==='
          grep -RniE --include='*.py' 'upsert_reasoning_seed|upsert_question_architecture|universal_question_seed_map|universal_reasoning_seeds' . | grep -vE 'smoke_tests|simulator|historical_acceptance|legacy_test|frozen_' | head -3000 || true
          echo '=== INTEGRATION ADMISSION PROJECTION ==='
          sed -n '720,790p' scoremax_integration_v1.py
          sed -n '1080,1160p' scoremax_integration_v1.py
          echo '=== APP UNIVERSAL SHADOW FEED REFERENCES ==='
          grep -nE 'universal_mastery|shadow|architecture_question|ph_reasoning_seed|seed_mappings' app.py | head -2500 || true
