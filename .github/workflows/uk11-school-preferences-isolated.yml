name: UK11 school preferences isolated tests
on:
  push:
    branches:
      - preview/uk11-static-site-20261123
    paths:
      - 'uk11_integration/**'
      - '.github/workflows/uk11-school-preferences-isolated.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  school-preferences:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install narrow test dependencies
        run: python -m pip install 'Flask>=3,<4' 'pytest>=8,<10'
      - name: Isolated synthetic Flask/SQLite regression
        run: python -m pytest -q uk11_integration/test_uk11_account_preferences.py
