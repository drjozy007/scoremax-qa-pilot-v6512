name: Live Integration Health Probe
on:
  push:
    branches: [ops/emergency-return-live-health-probe-20260916]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read public ScoreMax integration health
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request
          url='https://scoremax-preimport-persistent.onrender.com/api/integration/v1/health'
          with urllib.request.urlopen(url,timeout=20) as r:
              print('HTTP',r.status)
              raw=r.read().decode('utf-8','replace')
          data=json.loads(raw)
          print(json.dumps(data,sort_keys=True,indent=2))
          inc=[x for x in data.get('directions',[]) if x.get('contract')=='SM_PH_CONTENT_INCIDENT_V1']
          assert len(inc)==1,inc
          print('INCIDENT_HEALTH',json.dumps(inc[0],sort_keys=True))
          print('WORKER',json.dumps(data.get('worker'),sort_keys=True))
          PY
