{% extends 'base.html' %}{% block content %}<div class='card'><h2>Institutions</h2><form method='post' class='form-grid'>{% if csrf_token %}<input type="hidden" name="_csrf_token" value="{{csrf_token()}}">{% endif %}<label>Name<input name='name' required></label><label>Type<select name='institution_type'><option>College</option><option>School</option><option>Academy</option></select></label><label>Province<input name='province'></label><label>Division<input name='division'></label><label>District<input name='district'></label><label>Board<input name='board'></label><div class='full'><button class='btn'>Add institution</button></div></form></div><div class='card'><div class='table-wrap'><table><tr><th>Code</th><th>Name</th><th>District</th><th>Division</th><th>Province</th><th>Board</th><th></th></tr>{% for i in institutions %}<tr><td>{{ i.institution_code }}</td><td>{{ i.name }}</td><td>{{ i.district }}</td><td>{{ i.division }}</td><td>{{ i.province }}</td><td>{{ i.board }}</td><td><a href="{{ url_for('admin_institution_detail',institution_id=i.id) }}">Manage</a></td></tr>{% endfor %}</table></div></div>{% endblock %}
